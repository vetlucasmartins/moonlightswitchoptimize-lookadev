name: Build Moonlight-Switch

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: docker://devkitpro/devkita64:latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Remove useless fonts
      run: rm -rf ./resources/font

    - name: Remove enet
      run: dkp-pacman --noconfirm -R switch-enet || true

    - name: Run cmake
      run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=ON -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

    - name: Run build
      run: make -C build/switch Moonlight.nro -j$(nproc)

    - name: Rename artifact 
      run: mv build/switch/Moonlight.nro build/switch/Moonlight-Switch.nro

    - name: Upload Moonlight-Switch.nro
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-Switch.nro
        path: build/switch/Moonlight-Switch.nro

    - name: Upload Moonlight-Switch.elf
      uses: actions/upload-artifact@v4
      with:
        name: Debug.elf
        path: build/switch/Moonlight.elf
